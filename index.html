<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dashboard ESP32</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 20px;
      background: #0d0d0d;
      color: #e0e0e0;
    }

    h2 {
      margin: 0 0 10px 0;
      color: #00ff99;
      text-align: center;
      font-size: 20px;
    }

    /* GRID PRINCIPAL */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    /* CARDS */
    .card {
      background: #1a1a1a;
      border: 1px solid #00ff99;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 0 12px rgba(0,255,150,0.15);
    }

    .chart-box {
      width: 100%;
      height: 300px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .stat-line {
      font-size: 16px;
      margin: 4px 0;
    }

    .green {
      color: #00ff99;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1 style="color:#00ff99; text-align:center; margin-bottom:25px;">
  📡 Dashboard ESP32 – Dark Mode Premium
</h1>

<!-- Top Stats -->
<div class="grid">
  <div class="card">
    <h2>Distância (cm)</h2>
    <div class="stat-line">Média: <span class="green" id="mDist"></span></div>
    <div class="stat-line">Máximo: <span class="green" id="xDist"></span></div>
    <div class="stat-line">Mínimo: <span class="green" id="nDist"></span></div>
  </div>

  <div class="card">
    <h2>Tensão (V)</h2>
    <div class="stat-line">Média: <span class="green" id="mVolt"></span></div>
    <div class="stat-line">Máximo: <span class="green" id="xVolt"></span></div>
    <div class="stat-line">Mínimo: <span class="green" id="nVolt"></span></div>
  </div>
</div>

<!-- 2 Charts -->
<div class="grid">
  <div class="card">
    <h2>Distância (cm)</h2>
    <div class="chart-box"><canvas id="gDist"></canvas></div>
  </div>

  <div class="card">
    <h2>Tensão (V)</h2>
    <div class="chart-box"><canvas id="gVolt"></canvas></div>
  </div>
</div>

<!-- 2 Charts -->
<div class="grid">
  <div class="card">
    <h2>Corrente (mA)</h2>
    <div class="chart-box"><canvas id="gCorr"></canvas></div>
  </div>

  <div class="card">
    <h2>Potência (mW)</h2>
    <div class="chart-box"><canvas id="gPot"></canvas></div>
  </div>
</div>

<!-- Bottom Stats -->
<div class="grid">
  <div class="card">
    <h2>Corrente (mA)</h2>
    <div class="stat-line">Média: <span class="green" id="mCorr"></span></div>
    <div class="stat-line">Máximo: <span class="green" id="xCorr"></span></div>
    <div class="stat-line">Mínimo: <span class="green" id="nCorr"></span></div>
  </div>

  <div class="card">
    <h2>Potência (mW)</h2>
    <div class="stat-line">Média: <span class="green" id="mPot"></span></div>
    <div class="stat-line">Máximo: <span class="green" id="xPot"></span></div>
    <div class="stat-line">Mínimo: <span class="green" id="nPot"></span></div>
  </div>
</div>

<script>
  // Firebase
  const firebaseConfig = {
    apiKey: "api_key",
    authDomain: "upkeepnow-6ec42.firebaseapp.com",
    databaseURL: "https://upkeepnow-6ec42-default-rtdb.firebaseio.com/",
    projectId: "upkeepnow-6ec42",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let labels = [];
  let distArr = [], voltArr = [], corrArr = [], potArr = [];

  // Cores especiais por gráfico
  const colors = {
    dist: "#00ff99",
    volt: "#ffcc00",
    corr: "#3399ff",
    pot:  "#ff5555"
  };

  function novoGrafico(id, label, color) {
    return new Chart(document.getElementById(id), {
      type: "line",
      data: {
        labels: labels,
        datasets: [{
          label: label,
          data: [],
          borderColor: color,
          backgroundColor: color + "33",
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { x: { ticks: { color: "#aaa"} }, y:{ ticks:{color:"#aaa"} } }
      }
    });
  }

  const gDist = novoGrafico("gDist", "Distância", colors.dist);
  const gVolt = novoGrafico("gVolt", "Tensão",   colors.volt);
  const gCorr = novoGrafico("gCorr", "Corrente", colors.corr);
  const gPot  = novoGrafico("gPot",  "Potência", colors.pot);

  function stats(arr, pre) {
    if (arr.length === 0) return;
    document.getElementById("m"+pre).innerText = (arr.reduce((a,b)=>a+b)/arr.length).toFixed(2);
    document.getElementById("x"+pre).innerText = Math.max(...arr).toFixed(2);
    document.getElementById("n"+pre).innerText = Math.min(...arr).toFixed(2);
  }

  // Listener
  db.ref("/monitoramento").on("child_added", snap => {
    const d = snap.val();
    labels.push("");

    distArr.push(d.distancia_cm);
    voltArr.push(d.tensao_V);
    corrArr.push(d.corrente_mA);
    potArr.push(d.potencia_mW);

    gDist.data.datasets[0].data = distArr;
    gVolt.data.datasets[0].data = voltArr;
    gCorr.data.datasets[0].data = corrArr;
    gPot.data.datasets[0].data  = potArr;

    gDist.update();
    gVolt.update();
    gCorr.update();
    gPot.update();

    stats(distArr, "Dist");
    stats(voltArr, "Volt");
    stats(corrArr, "Corr");
    stats(potArr,  "Pot");
  });
</script>

</body>
</html>
